name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-14
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x64
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64)

      - name: Install Electron build dependencies
        run: npm install --no-audit --no-fund

      # Copies the runner's Node 24 into desktop/vendor/node/<platform>-<arch>/.
      # The packaged app prefers this bundle before THREE_STUDIO_NODE/PATH.
      - name: Bundle Node 24
        run: npm run prepare-node

      - name: Release checks
        run: npm run release-check

      - name: Build installers
        run: npm run dist -- --publish never
        env:
          # Optional signing. Electron-builder skips signing when these are
          # empty. Configure repository secrets to enable it.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Optional macOS notarization (set desktop/package.json mac.notarize
          # to true once these secrets are configured).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: three-studio-desktop-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
