<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a101a"/>
      <stop offset="0.55" stop-color="#0d1421"/>
      <stop offset="1" stop-color="#111a2c"/>
    </linearGradient>
    <linearGradient id="mark" x1="190" y1="800" x2="860" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5578ff"/>
      <stop offset="0.52" stop-color="#7d9dff"/>
      <stop offset="1" stop-color="#2ed7ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(512 470) rotate(90) scale(430)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d7dff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5d7dff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- faint technical grid -->
    <g stroke="#22324d" stroke-width="1" opacity=".34">
      <path d="M128 256H896M128 512H896M128 768H896"/>
      <path d="M256 128V896M512 128V896M768 128V896"/>
    </g>
    <g fill="#2b4166" opacity=".55">
      <circle cx="128" cy="256" r="3"/><circle cx="896" cy="256" r="3"/>
      <circle cx="128" cy="768" r="3"/><circle cx="896" cy="768" r="3"/>
      <circle cx="256" cy="128" r="3"/><circle cx="768" cy="128" r="3"/>
      <circle cx="256" cy="896" r="3"/><circle cx="768" cy="896" r="3"/>
    </g>

    <!-- back prism plane -->
    <path d="M604 244 930 838 278 838Z" fill="none" stroke="#32486f" stroke-width="16"
          stroke-linejoin="round" opacity=".62"/>

    <!-- front triangular prism silhouette -->
    <path d="M512 176 844 780 180 780Z" fill="none" stroke="url(#mark)" stroke-width="38"
          stroke-linejoin="round" filter="url(#softGlow)"/>
    <path d="M512 176 844 780 180 780Z" fill="none" stroke="url(#mark)" stroke-width="22"
          stroke-linejoin="round"/>

    <!-- S-shaped signal through the prism -->
    <path d="M330 648c0-104 130-104 182-140 52-36 182-36 182-140" fill="none"
          stroke="url(#mark)" stroke-width="46" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M330 648c0-104 130-104 182-140 52-36 182-36 182-140" fill="none"
          stroke="#dff3ff" stroke-width="14" stroke-linecap="round" opacity=".92"/>

    <!-- vertices -->
    <g fill="#0a101a" stroke="#9db8ff" stroke-width="12">
      <circle cx="512" cy="176" r="22"/>
      <circle cx="844" cy="780" r="22"/>
      <circle cx="180" cy="780" r="22"/>
    </g>
    <g fill="#2ed7ff">
      <circle cx="512" cy="176" r="7"/>
      <circle cx="844" cy="780" r="7"/>
      <circle cx="180" cy="780" r="7"/>
    </g>

    <!-- bottom registration line -->
    <path d="M330 884H694" stroke="#2a405f" stroke-width="10" stroke-linecap="round" opacity=".72"/>
    <path d="M470 884H554" stroke="#6f8dff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  </g>

  <rect x="1" y="1" width="1022" height="1022" rx="223" fill="none" stroke="#2c4266" stroke-width="2" opacity=".8"/>
</svg>
