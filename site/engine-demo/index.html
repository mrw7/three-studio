  <title>TURBOFAN — 涡扇发动机数字说明书</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {

        "three/addons/": "../runtime/"
      }
    }

</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="../index.html">
      <span class="brand-mark">T</span>
      <span><strong>TURBOFAN</strong><small>DIGITAL MANUAL · THREE STUDIO</small></span>
    </a>
    <nav class="topnav" aria-label="Demo 导航">
      <a href="../index.html">Demo gallery</a>
      <a href="../lamplighter-demo/">Next: LAMPLIGHTER</a>
    </nav>
    <a class="top-cta" href="mailto:three.studio.2026@outlook.com?subject=Three%20Studio%20manual">做同款说明书 <span aria-hidden="true">↗</span></a>
  </header>

  <main class="layout">
    <aside class="manual" aria-label="说明书步骤">
      <div class="manual-head">
        <p class="eyebrow">MANUAL / 8 STEPS</p>
        <h1 id="manual-title">涡扇发动机</h1>
        <p id="manual-sub" class="manual-sub"></p>
      </div>

      <ol id="step-list" class="step-list"></ol>

      <div class="step-body" id="step-panel">
        <h2 id="step-title"></h2>
        <p id="step-text"></p>
        <div id="step-hotspots" class="chips" aria-label="热点"></div>
      </div>

      <nav class="step-nav" aria-label="步骤导航">
        <button type="button" id="prev">上一步</button>
        <span id="step-count"></span>
        <button type="button" id="next">下一步</button>
      </nav>

      <details class="bom" id="bom-panel">
        <summary>零件清单 / BOM <span id="bom-count"></span></summary>
        <ul id="bom-list"></ul>
      </details>
    </aside>
  </main>

  <footer class="site-footer">
