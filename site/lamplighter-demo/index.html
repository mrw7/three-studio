<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070c">
  <meta name="description" content="The Lamplighter 点灯人 — 60 秒十镜 Three.js 短片：雾夜、小机器人、与它让出的最后一束光。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2305070c'/%3E%3Ccircle cx='32' cy='31' r='8' fill='%23ffd49a'/%3E%3Cpath d='M32 23v-8M32 39v8M24 31h-8M40 31h8M26 25l-5-5M38 37l5 5M38 25l5-5M26 37l-5 5' stroke='%23b7c7dd' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>The Lamplighter 点灯人 — a 60-second film</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../runtime/three.module.js",
        "three/addons/": "../runtime/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="../index.html">
      <span class="brand-mark">L</span>
      <span><strong>THE LAMPLIGHTER</strong><small>点灯人 · A THREE STUDIO FILM</small></span>
    </a>
    <nav class="topnav" aria-label="Demo 导航">
      <a href="../index.html">Demo gallery</a>
      <a href="../engine-demo/">TURBOFAN</a>
    </nav>
    <a class="top-cta" href="mailto:three.studio.2026@outlook.com?subject=Three%20Studio%20film">预约同款短片 <span aria-hidden="true">↗</span></a>
  </header>

  <main class="overlay">
    <section class="hero" id="hero">
      <p class="eyebrow">A 60-SECOND PROCEDURAL FILM</p>
      <h1>它把最后的光<br><em>让给了整条街。</em></h1>
      <p class="lede">雾夜里，一个靠胸口一颗灯泡活着的小机器人，爬上灯柱，
        把自己胸口的灯拧进灯座——然后熄灭。</p>
      <button type="button" class="play-cta" id="play-cta">
        <span class="play-glyph" aria-hidden="true">▶</span>
        播放短片 <small>60s · 十镜 · 纯代码</small>
      </button>
    </section>

    <p class="caption" id="caption" aria-live="polite"></p>

    <div class="player" id="player">
      <div class="shots" id="shots" role="group" aria-label="镜头"></div>
      <div class="timeline">
        <button type="button" id="toggle" aria-label="播放 / 暂停">▶</button>
        <span class="clock" id="clock">00:00 / 01:00</span>
        <input id="seek" type="range" min="0" max="60" step="0.05" value="0" aria-label="播放进度">
        <span class="shot-label" id="shot-label"></span>
        <button type="button" id="replay" aria-label="重播">重播</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>THE LAMPLIGHTER 是 Three Studio 的程序化短片 demo，全部由代码实时生成。</span>
    <span>Built with <a href="https://github.com/mrw7/three-studio">Three Studio</a> · Three.js</span>
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
